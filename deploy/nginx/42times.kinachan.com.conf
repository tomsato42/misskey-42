# misskey-42 (https://42times.kinachan.com) 用の nginx 設定。
# 配置先: /etc/nginx/conf.d/42times.kinachan.com.conf
# 書き方は同じ VPS の /etc/nginx/conf.d/mi.kinachan.com.conf (joinmisskey/bash-install が作ったもの) に合わせている。
#
# このファイルでは次のものを定義しない (mi.kinachan.com.conf で http ブロックに定義済み)。
#   - map $http_upgrade $connection_upgrade: 同じ変数を 2 回定義すると nginx -t がエラーになる。
#     mi.kinachan.com.conf を消すときは、map をこのファイルに移すこと
#
# 証明書は certbot (dns-cloudflare) で取る前提 (deploy/README.md の手順)。

server {
    listen 80;
    listen [::]:80;
    server_name 42times.kinachan.com;

    # For SSL domain validation
    root /var/www/html;
    location /.well-known/acme-challenge/ { allow all; }
    location /.well-known/pki-validation/ { allow all; }

    # with https
    location / { return 301 https://$server_name$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 以降は listen の http2 パラメーターが非推奨なので、http2 ディレクティブを使う
    http2 on;
    server_name 42times.kinachan.com;

    ssl_session_timeout 1d;
    ssl_session_cache shared:ssl_session_cache:10m;
    ssl_session_tickets off;

    # To use Let's Encrypt certificate
    ssl_certificate     /etc/letsencrypt/live/42times.kinachan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/42times.kinachan.com/privkey.pem;

    # SSL protocol settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    # mi.kinachan.com.conf にある ssl_stapling は入れない。
    # Let's Encrypt は OCSP の提供を終えており、新しく取った証明書には OCSP の URL が入らないため

    # アップロードの上限。Misskey の maxFileSize の既定値 (262144000 バイト = 250MB) に合わせる。
    # Cloudflare の無料プランでは 1 リクエスト 100MB までしか通らない
    client_max_body_size 250m;

    # クライアントの IP アドレス
    # Cloudflare 経由のリクエストでは、接続元 ($remote_addr) は Cloudflare のサーバーになる。
    # 接続元が Cloudflare の IP 範囲のときだけ CF-Connecting-IP ヘッダーを信頼して $remote_addr を置き換える。
    # Cloudflare 以外から直接来たリクエストでは CF-Connecting-IP を無視するので、ヘッダーを偽っても IP を詐称できない。
    # X-Forwarded-For を使う方法 (Misskey の trustProxy に Cloudflare の範囲を入れる) にしなかった理由:
    #   - nginx のアクセスログと fail2ban にも本当のクライアントの IP が出る
    #   - Cloudflare の IP 範囲をこのファイル 1 か所だけで管理できる (Misskey の trustProxy はループバックだけでよい)
    # Cloudflare の IP 範囲は https://www.cloudflare.com/ips/ で公開されている (2026-10-18 に確認)。変わったら更新する
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ログイン画面に出すアイコンなど (ログインしていない人にも見せてよいもの)
    # nginx の実行ユーザー (nginx) が /home/misskey を通れるようにしておく必要がある (deploy/README.md の手順)
    location /instance-assets/ {
        alias /home/misskey/42times-assets/;
        autoindex off;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Proxy to Node
    # mi.kinachan.com.conf と違い proxy_cache は使わない。ログインしている人にだけ見せる内容を
    # 誤って共有のキャッシュに入れないため (Misskey 側でも Cache-Control: private にしている)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        # 上の real_ip で置き換えたクライアントの IP を 1 つだけ渡す (クライアントが送ってきた X-Forwarded-For は捨てる)。
        # Misskey 側の trustProxy は 127.0.0.1 と ::1 だけにする (deploy/default.yml.example)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_redirect off;

        # For WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
